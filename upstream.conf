# Upstream openrsync this port is built from (D1): a pinned master commit of
# github.com/kristapsdz/openrsync, which has made no release since 0.5.0. GitHub
# publishes no signature for it, so the pin is the commit and the archive's
# SHA-256 alone (as vms-libxml2). GitHub doesn't promise its archive tarballs stay
# byte-identical: if the checksum ever fails, check the commit is unchanged and
# re-pin.
UPSTREAM_NAME=openrsync
UPSTREAM_COMMIT=8235c68f11b4fad5e24849a01d04ea153c29ee28
UPSTREAM_DATE=2026-07-30
UPSTREAM_URL=https://github.com/kristapsdz/openrsync/archive/8235c68f11b4fad5e24849a01d04ea153c29ee28.tar.gz
UPSTREAM_SHA256=256dad12f25aceb4adb712b52e5f69db66fa7d4d1450d802ab23d066f4d1c27d
# Our patch level on top of it (openrsync-20260730-vms1)
VMS_PATCH_LEVEL=1
# The PCSI product version (D0): T for an early test; the update number is
# VMS_PATCH_LEVEL. The kit version is openrsync-<UPSTREAM_DATE without dashes>-vms<level>.
PCSI_VERSION=T0.1-1
